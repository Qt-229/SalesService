name: Sales Service Project (CI included) | © 2026

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up JDK 24
      uses: actions/setup-java@v4
      with:
        java-version: '24'
        distribution: 'temurin'
        cache: maven

    - name: Build with Maven
      run: mvn -B package --file SalesService/pom.xml

    - name: Distribute jar file
      run: mkdir staging && cp SalesService/target/*.jar staging

    - name: Make hyperlink to jar file
      uses: actions/upload-artifact@v4
      with:
        name: SalesService-1.0-SNAPSHOT
        path: staging
